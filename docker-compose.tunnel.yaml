name: typebot
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: baptistearno/typebot-builder:latest
    container_name: typebot-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: typebot-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      NEXTAUTH_URL: http://${BASE_HOST_NAME:-$HOSTNAME}
      NEXT_PUBLIC_VIEWER_URL: http://${BASE_HOST_NAME:-$HOSTNAME}
      NEXTAUTH_SECRET: ${APP_SECRET_TOKEN_32:-replace-with-a-random-32-byte-hex-string}
      ENCRYPTION_SECRET: ${APP_SECRET_KEY:-replace-with-a-random-16-byte-hex-string}
      DATABASE_URL: postgresql://${DB_USER_NAME:-typebot}:${DB_USER_PASS:-replace-with-a-random-password}@typebot-db:5432/${DB_CREATE_DATABASE_NAME:-typebot}
      ADMIN_EMAIL: ${APP_ADMIN_USER:-admin}@${BASE_DOMAIN_NAME:-example.com}
      SMTP_HOST: ${EMAIL_SERVER_HOST:-172.17.0.1}
      SMTP_PORT: ${EMAIL_SERVER_PORT:-587}
      SMTP_USERNAME: ${EMAIL_SERVER_LOGIN_NAME:-}
      SMTP_PASSWORD: ${EMAIL_SERVER_LOGIN_PASS:-}
      NEXT_PUBLIC_SMTP_FROM: ${EMAIL_SERVER_MAIL_FROM:-no-reply@example.com}
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/3000']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/data/typebot:/data:z'
    depends_on:
      typebot-db:
        condition: service_healthy
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://typebot-app:3000'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - typebot
      - cloudflare

  typebot-db:
    image: postgres:latest
    container_name: typebot-db
    hostname: typebot-db
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: typebot-db
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-typebot}
      POSTGRES_USER: ${DB_USER_NAME:-typebot}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-replace-with-a-random-password}
    volumes:
      - './volumes/db/postgres/typebot:/var/lib/postgresql/data:z'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - typebot

networks:
  typebot:
    name: typebot
    external: false
  cloudflare:
    external: true
